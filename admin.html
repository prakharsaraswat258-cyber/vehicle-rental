<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Vehicle Rental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div id="admin-main" hidden>
      <h1>Admin dashboard</h1>
      <div class="tabs" role="tablist">
        <button class="btn" type="button" role="tab" data-tab="tab-vehicles" aria-selected="true">Vehicles</button>
        <button class="btn" type="button" role="tab" data-tab="tab-bookings" aria-selected="false">Bookings</button>
        <button class="btn" type="button" role="tab" data-tab="tab-maintenance" aria-selected="false">Maintenance</button>
      </div>
      <div id="admin-msg"></div>

      <section id="tab-vehicles">
        <div class="card">
          <h2>All vehicles</h2>
          <div id="vehicles-table"></div>
        </div>
        <div class="card">
          <h2>Add vehicle</h2>
          <form id="add-vehicle-form" novalidate>
            <div class="form-row">
              <div class="field">
                <label for="vname">Name</label>
                <input type="text" id="vname" name="vname">
              </div>
              <div class="field">
                <label for="vtype">Type</label>
                <select id="vtype" name="vtype">
                  <option>Car</option>
                  <option>Bike</option>
                  <option>Scooter</option>
                </select>
              </div>
              <div class="field">
                <label for="price">Price per day (₹)</label>
                <input type="number" id="price" name="price" min="1" step="1">
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="image">Image file name (optional)</label>
                <input type="text" id="image" name="image" placeholder="images/x.jpg">
              </div>
              <div class="field">
                <label for="description">Description (optional)</label>
                <input type="text" id="description" name="description">
              </div>
            </div>
            <button class="btn" type="submit">Add vehicle</button>
          </form>
        </div>
      </section>

      <section id="tab-bookings" hidden>
        <div class="card">
          <h2>All bookings</h2>
          <div id="bookings-table"></div>
        </div>
      </section>

      <section id="tab-maintenance" hidden>
        <div class="card">
          <h2>Schedule maintenance</h2>
          <form id="maintenance-form" novalidate>
            <div class="form-row">
              <div class="field">
                <label for="mt-vehicle">Vehicle</label>
                <select id="mt-vehicle" name="mt-vehicle"></select>
              </div>
              <div class="field">
                <label for="mt-start">Start date</label>
                <input type="date" id="mt-start" name="mt-start">
              </div>
              <div class="field">
                <label for="mt-end">End date</label>
                <input type="date" id="mt-end" name="mt-end">
              </div>
            </div>
            <div class="field">
              <label for="mt-note">Note (optional)</label>
              <input type="text" id="mt-note" name="mt-note" placeholder="Service">
            </div>
            <button class="btn" type="submit">Schedule maintenance</button>
          </form>
        </div>
        <div class="card">
          <h2>Scheduled maintenance</h2>
          <div id="maintenance-table"></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/logic.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
